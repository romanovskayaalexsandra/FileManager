<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>{{ title }}</title>
</head>
<body class="light-theme">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">✅ TaskManager</a>
            <div class="ml-auto">
                {% if current_user.is_authenticated %}
                    <span class="text-white mr-2">{{ current_user.username }}</span>
                    <button id="themeToggle" class="btn btn-sm btn-outline-light mr-2">🌙</button>
                    <a href="/logout" class="btn btn-sm btn-danger">Выйти</a>
                {% else %}
                    <a href="/login" class="btn btn-outline-light">Вход</a>
                    <a href="/register" class="btn btn-light">Регистрация</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>
    <script>
        const toggle = document.getElementById('themeToggle');
        const body = document.body;
        if (localStorage.getItem('theme') === 'dark') {
            body.classList.add('dark-theme');
            body.classList.remove('light-theme');
            if (toggle) toggle.innerText = '☀️';
        }
        if (toggle) {
            toggle.addEventListener('click', () => {
                if (body.classList.contains('light-theme')) {
                    body.classList.add('dark-theme');
                    body.classList.remove('light-theme');
                    localStorage.setItem('theme', 'dark');
                    toggle.innerText = '☀️';
                } else {
                    body.classList.add('light-theme');
                    body.classList.remove('dark-theme');
                    localStorage.setItem('theme', 'light');
                    toggle.innerText = '🌙';
                }
            });
        }
    </script>
</body>
</html>
